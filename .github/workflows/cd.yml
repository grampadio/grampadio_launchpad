name: GramPad CD

on:
  workflow_run:
    workflows: ["GramPad CI"]
    types:
      - completed

jobs:
  deploy:
    # Deploy only when CI succeeds AND the CI run was for main
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'

    runs-on: ubuntu-latest

    steps:
      - name: Deploy to GramPad server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          passphrase: ${{ secrets.SERVER_SSH_PASSPHRASE }}

          script: |
            set -e

            echo "Loading NVM..."

            export NVM_DIR="$HOME/.nvm"

            if [ -s "$NVM_DIR/nvm.sh" ]; then
              . "$NVM_DIR/nvm.sh"
            else
              echo "ERROR: NVM not found"
              exit 1
            fi

            echo "Using Node 24..."
            nvm use 24

            echo "Node version:"
            node -v

            echo "NPM version:"
            npm -v

            echo "Changing to GramPad directory..."
            cd /var/www/grampadio_launchpad

            echo "Updating code from main..."
            git fetch origin main
            git reset --hard origin/main

            echo "Removing old node_modules..."
            rm -rf node_modules

            echo "Installing dependencies..."
            npm ci

            echo "Building GramPad..."
            npm run build

            echo "Deployment completed successfully!"
